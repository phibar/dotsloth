name: changeset

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    # The release PR bumps the version itself and never carries a changeset.
    if: ${{ github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      - name: Does this PR carry a changeset?
        id: status
        run: |
          set -uo pipefail
          git fetch --quiet origin "${BASE_REF}"
          if npx changeset status --since "origin/${BASE_REF}" > status.txt 2>&1; then
            # `status` exits 0 whether or not changesets exist, so read the output.
            if grep -qi "no changesets" status.txt; then
              echo "found=false" >> "$GITHUB_OUTPUT"
            else
              echo "found=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          cat status.txt
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          FOUND: ${{ steps.status.outputs.found }}
        run: |
          set -euo pipefail
          marker="<!-- changeset-status -->"

          if [ "$FOUND" = "true" ]; then
            body="$marker
          **Changeset found.** This PR will be included in the next \`Version Packages\` release PR."
          else
            body="$marker
          **No changeset.** If this PR changes anything a user would notice, add one:

          \`\`\`sh
          npm run changeset
          \`\`\`

          Pick \`patch\`, \`minor\` or \`major\`, write a one-line summary, and commit the generated file.
          Refactors, CI and docs changes do not need one — run \`npm run changeset -- --empty\` to say so deliberately.

          This check is informational and does not block merging."
          fi

          # Update the existing comment rather than adding one per push.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                --jq "[.[] | select(.body | startswith(\"$marker\"))] | .[0].id // empty")

          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
