name: dependabot changeset

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Dependabot never writes a changeset. Production dependency bumps ship to
# users and need a patch changeset, so this commits one for them. All other
# Dependabot updates pass the changeset check without a file.
permissions:
  contents: write

jobs:
  add-changeset:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Write a patch changeset for production dependency bumps
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Already carries one (a rerun, or a force-push): leave it alone.
          if git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- '.changeset/*.md' \
             | grep -qv '/README.md$'; then
            echo "Changeset already present."
            exit 0
          fi

          # Only production dependency bumps need a changeset: they change
          # what users install and earn a patch release. Everything else
          # (devDependencies, GitHub Actions) passes the changeset check
          # without a file, so no commit is pushed and `@dependabot rebase`
          # keeps working.
          if ! dep=$(bash .github/scripts/prod-deps-changed.sh "origin/${BASE_REF}"); then
            echo "No production dependency changed - no changeset needed."
            exit 0
          fi
          echo "Production dependency changed: ${dep}"

          file=".changeset/dependabot-$(date +%s).md"
          {
            echo '---'
            echo '"@phibar/dotsloth": patch'
            echo '---'
            echo
            echo "${PR_TITLE}"
          } > "$file"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$file"
          git commit -m "chore: add changeset for dependabot update"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
