name: dependabot changeset

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Dependabot never writes a changeset, so without this its PRs could never
# satisfy the changeset check and would be permanently unmergeable.
permissions:
  contents: write

jobs:
  add-changeset:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Write a changeset matching the dependency type
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Already carries one (a rerun, or a force-push): leave it alone.
          if git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- '.changeset/*.md' \
             | grep -qv '/README.md$'; then
            echo "Changeset already present."
            exit 0
          fi

          git diff "origin/${BASE_REF}...HEAD" -- package.json > /tmp/pkg.diff || true

          # Production dependencies install on users' machines, so bumping one
          # changes what users actually run and earns a patch release.
          # devDependencies never reach the published package, so an empty
          # changeset records "no release" deliberately.
          #
          # The list is read from package.json rather than hardcoded so it
          # cannot drift, and matched as a fixed string - a dependency name
          # contains dots and slashes that would misbehave as a regex.
          git show "origin/${BASE_REF}:package.json" \
            | node -p "Object.keys(JSON.parse(require('fs').readFileSync(0)).dependencies||{}).join('\n')" \
            > /tmp/prod.txt

          kind=none
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            if grep -F -q "\"${dep}\"" /tmp/pkg.diff; then
              echo "Production dependency changed: ${dep}"
              kind=patch
              break
            fi
          done < /tmp/prod.txt

          file=".changeset/dependabot-$(date +%s).md"
          if [ "$kind" = "patch" ]; then
            {
              echo '---'
              echo '"@phibar/dotsloth": patch'
              echo '---'
              echo
              echo "${PR_TITLE}"
            } > "$file"
            echo "Wrote a patch changeset."
          else
            printf -- '---\n---\n' > "$file"
            echo "Wrote an empty changeset: development dependencies only."
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$file"
          git commit -m "chore: add changeset for dependabot update"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
