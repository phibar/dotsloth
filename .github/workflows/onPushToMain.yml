name: version, tag and github release

on:
  push:
    branches: [main]

# The built-in GITHUB_TOKEN needs write access to push the README commit and
# to create the release. This replaces the GH_TOKEN/GH_EMAIL/GH_USERNAME
# secrets, which were never configured on this repo.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check if version already exists
        id: version-check
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")

          if gh release view "v$package_version" >/dev/null 2>&1; then
            echo "::warning file=package.json,line=1::Version v$package_version already exists - no release will be created. Bump the version in package.json to cut a new one."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version v$package_version does not exist. Creating release..."
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "tag=v$package_version" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate oclif README
        if: ${{ steps.version-check.outputs.skipped == 'false' }}
        run: |
          set -euo pipefail
          # Identify as the Actions bot. The previous GH_EMAIL/GH_USERNAME
          # secrets did not exist, so these expanded to nothing and
          # `git config --global user.email` exited 1 under `bash -e`,
          # failing every run since the repo was created.
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          npm ci
          npm exec oclif readme

          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "chore: update README.md"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "README already up to date"
          fi

      - name: Create GitHub Release
        if: ${{ steps.version-check.outputs.skipped == 'false' }}
        uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5
        with:
          name: ${{ steps.version-check.outputs.tag }}
          tag: ${{ steps.version-check.outputs.tag }}
          commit: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          skipIfReleaseExists: true
