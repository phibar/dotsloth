name: release

on:
  push:
    branches: [main]
  # Manual trigger for recovery: the release commit carries a skip-CI marker,
  # so after fixing something like an expired npm token there is otherwise no
  # push to retrigger the publish.
  workflow_dispatch:

concurrency:
  # Two releases must never interleave: they would race on the version commit
  # and could publish out of order.
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  # Required for npm trusted publishing: lets the job mint an OIDC token that
  # npm exchanges for short-lived publish credentials. No npm token involved.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately no registry-url. setup-node would then write an .npmrc
      # containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and set
      # NODE_AUTH_TOKEN to its placeholder "XXXXX-XXXXX-XXXXX-XXXXX" when no
      # token is supplied. npm finds that explicit (garbage) credential, uses
      # it, and never falls back to OIDC - which is exactly how the 0.1.0
      # publish failed with E404. npm already defaults to registry.npmjs.org,
      # and package.json carries publishConfig.access=public.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Trusted publishing needs npm >= 11.5.1. lts/* currently ships a newer
      # npm than that, but if it ever resolves lower the failure surfaces as an
      # opaque auth error at publish time, so make it explicit and self-healing.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          required=11.5.1
          current=$(npm -v)
          lowest=$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)
          if [ "$lowest" != "$required" ]; then
            echo "npm $current is older than $required - upgrading for OIDC support."
            npm install -g npm@latest
          fi
          echo "npm $(npm -v) (node $(node -v))"

      - run: npm ci

      - name: Any changesets pending?
        id: pending
        run: |
          set -uo pipefail
          # Any .changeset/*.md other than the README is a pending changeset.
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "No changesets pending - nothing to release."
          else
            echo "$count changeset(s) pending."
          fi

      - name: Apply versions
        if: ${{ steps.pending.outputs.count != '0' }}
        run: npm run version
        env:
          # @changesets/changelog-github needs this to build PR links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always build: a recovery run has no pending changesets but still
      # publishes, and the package ships dist/ - publishing without it would
      # put a broken tarball on npm.
      - name: Build
        run: npm run build

      - name: Commit and push the version bump
        id: commit
        if: ${{ steps.pending.outputs.count != '0' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add -A
          # An empty changeset consumes itself without changing the version.
          if git diff --cached --quiet; then
            echo "Nothing to commit - changesets were empty."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Put the changelog section changesets just wrote into the commit
          # body, so `git log` explains each release without opening the file.
          # sed strips the blank line the heading leaves behind.
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 | sed '/./,$!d')
          {
            echo "chore: release v$version"
            echo
            echo "$notes"
            echo
            # Marker so this push does not retrigger the release workflow.
            echo "[skip ci]"
          } | git commit -F -

          # Push BEFORE publishing. npm releases are effectively permanent, so
          # if the push is rejected we must fail here with nothing published,
          # rather than leave npm ahead of main.
          git push origin HEAD:main
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Is this version already on npm?
        id: npm
        run: |
          set -uo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Keyed off the registry rather than off "did we just version", so a
          # run that versioned successfully but failed to publish (expired npm
          # token, registry outage) recovers on the next push to main instead
          # of stranding a version that exists in git but not on npm.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not on the registry - publishing."
          fi

      - name: Publish to npm
        if: ${{ steps.npm.outputs.needed == 'true' }}
        # Authenticated by OIDC via npm trusted publishing - deliberately no
        # NODE_AUTH_TOKEN. npm also attaches a provenance attestation
        # automatically on this path, linking the package to this exact commit
        # and workflow run.
        run: |
          set -euo pipefail
          # Fail loudly rather than silently falling back to a stale
          # credential: any configured _authToken means OIDC gets bypassed,
          # which is exactly how the 0.1.0 publish failed. npm prints an empty
          # string when the key is unset.
          token=$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null | tr -d '[:space:]')
          if [ -n "$token" ] && [ "$token" != "undefined" ] && [ "$token" != "null" ]; then
            echo "::error::An npm _authToken is configured, so OIDC would be bypassed. Remove registry-url / NODE_AUTH_TOKEN from this job."
            exit 1
          fi
          echo "No npm token configured - publishing over OIDC as $(npm -v)."
          npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags and create the GitHub release
        if: ${{ steps.npm.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.npm.outputs.version }}
        run: |
          set -euo pipefail
          git push origin --tags

          # changeset publish tags as v<version> for a single-package repo.
          tag="v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # Release notes come from the section changesets just wrote.
            notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 | sed '/./,$!d')
            gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}"
          fi
