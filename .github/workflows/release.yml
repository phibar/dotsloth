name: release

on:
  push:
    branches: [main]

concurrency:
  # Never let two release runs race on the version PR or on npm.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs history to tell which changesets are new.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # Bumps package.json, rewrites CHANGELOG.md, regenerates the oclif
          # README, and opens/updates the "Version Packages" PR.
          version: npm run version
          # Runs only once that PR is merged and changesets remain to release.
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
